[tool.black]
line-length = 120
target-version = ["py311"]
include = '\.pyi?$'
exclude = '''
/(
    \.venv
  | \.git
  | __pycache__
  | ai/stubs
)/
'''

[tool.isort]
profile = "black"
line_length = 120
known_first_party = ["ai"]
skip = [".venv", "ai/stubs"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["ai/stubs/", ".venv/"]

[tool.pytest.ini_options]
testpaths = ["ai/tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-q --tb=short"
